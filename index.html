<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenneth and Kimberly Wedding</title>
  
  <meta property="og:title" content="Kenneth & Kimberly Wedding Invitation" />
  <meta property="og:description" content="You're invited! October 28, 2026." />
  <meta property="og:image" content="https://kenneth-kimberly-wedding-invitation.vercel.app/preview.jpg" />
  <meta property="og:url" content="https://kenneth-kimberly-wedding-invitation.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wedding Invitation" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="mail-intro" aria-label="Open wedding invitation">
    <div class="envelope-wrap">
      <div class="envelope-title" aria-label="The Wedding of Ken and Kim">
        <span>The Wedding of</span>
        <strong>Ken &amp; Kim</strong>
      </div>
      <div class="envelope" role="button" tabindex="0" aria-label="Open wedding invitation">
        <div class="envelope-letter">
          <span>With love</span>
        </div>
        <div class="envelope-flap"></div>
        <div class="envelope-front"></div>
        <button id="open-invitation" class="envelope-seal" type="button" aria-label="Open wedding invitation"></button>
      </div>
      <div class="envelope-hint">Click to open</div>
    </div>
  </section>

  <header>
    <h1>You're Invited!</h1>
    
    <div id="countdown">
      <div class="countdown-item">
        <span id="months">00</span>
        <span class="label">Months</span>
      </div>
      <div class="countdown-item">
        <span id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="countdown-item">
        <span id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="countdown-item">
        <span id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </header>

  <main id="invitation-content" class="container">
    <img id="first-invitation-image" src="1.png" alt="Image 1" />
    <img src="page2pics.png" alt="Invitation page 2 photos" />

    <img src="2.png" alt="Image 2" />
    <img src="3.png" alt="Image 3" />
    <img class="scattered-polars" src="scatteredpolaroids.png" alt="Scattered polaroids design" />
    <img src="4.png" alt="Image 4" />
    <img src="5.png" alt="Image 5" />
    <section class="locations-section" aria-label="Wedding locations">
      <img src="locationsqr.png" alt="Ceremony and reception locations with QR codes" />
      <div class="map-links">
        <a href="https://www.google.com/maps/place/Christ+The+King+Cathedral/@6.4982808,124.8397035,16.5z/data=!4m6!3m5!1s0x32f818eb1c6872d3:0xd19668d0aa21826c!8m2!3d6.4982669!4d124.8420307!16s%2Fg%2F1pzprc0x3?entry=ttu&amp;g_ep=EgoyMDI2MDgxOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">View Map</a>
        <a href="https://www.google.com/maps/place/Cinco+Ni%C3%B1as/@6.5077737,124.8328842,17z/data=!4m14!1m7!3m6!1s0x32f818f42dd7d20f:0x435bc590e4f300da!2sCinco+Ni%C3%B1as!8m2!3d6.5077684!4d124.8354591!16s%2Fg%2F1tf7d5yq!3m5!1s0x32f818f42dd7d20f:0x435bc590e4f300da!8m2!3d6.5077684!4d124.8354591!16s%2Fg%2F1tf7d5yq?entry=ttu&amp;g_ep=EgoyMDI2MDgxOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">View Map</a>
      </div>
    </section>
    <section class="thank-you-section" aria-label="Thank you">
      <img src="thank-you.jpg" alt="Thank you" />
      <p>Thank You!</p>
    </section>
  </main>

  <audio id="music" loop preload="auto">
    <source src="instrumental.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const mailIntro = document.querySelector(".mail-intro");
    const envelope = document.querySelector(".envelope");
    const invitationContent = document.getElementById("invitation-content");

    const openEnvelope = () => {
      envelope.classList.add("is-open");
      mailIntro.classList.add("is-open");

      window.setTimeout(() => {
        invitationContent.classList.add("is-visible");
      }, 450);
    };

    envelope.addEventListener("click", openEnvelope);
    envelope.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openEnvelope();
      }
    });

    const audio = document.getElementById("music");
    let hasInteracted = false;

    // Function to start music
    const startMusic = () => {
      if (!hasInteracted) {
        audio.play().then(() => {
          hasInteracted = true;
          // Remove listeners once music starts
          window.removeEventListener("scroll", startMusic);
          document.removeEventListener("click", startMusic);
          document.removeEventListener("touchstart", startMusic);
        }).catch(err => {
          console.log("Waiting for user interaction to play audio...");
        });
      }
    };

    // Listen for scroll, click, or touch (mobile)
    window.addEventListener("scroll", startMusic, { passive: true });
    document.addEventListener("click", startMusic);
    document.addEventListener("touchstart", startMusic);

    // Countdown Logic
    function updateCountdown() {
      const targetDate = new Date(2026, 9, 28, 14, 0, 0);
      const now = new Date();
      const timeLeft = targetDate.getTime() - now.getTime();

      if (timeLeft > 0) {
        let months = 0;
        const monthCursor = new Date(now);

        while (true) {
          const nextMonth = new Date(monthCursor);
          nextMonth.setMonth(nextMonth.getMonth() + 1);

          if (nextMonth > targetDate) {
            break;
          }

          monthCursor.setTime(nextMonth.getTime());
          months++;
        }

        const remainingTime = targetDate.getTime() - monthCursor.getTime();
        const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
        const remainingDayTime = remainingTime % (1000 * 60 * 60 * 24);
        const hours = Math.floor(remainingDayTime / (1000 * 60 * 60));
        const minutes = Math.floor((remainingDayTime % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remainingDayTime % (1000 * 60)) / 1000);

        document.getElementById("months").textContent = months.toString().padStart(2, "0");
        document.getElementById("days").textContent = days.toString().padStart(2, "0");
        document.getElementById("hours").textContent = hours.toString().padStart(2, "0");
        document.getElementById("minutes").textContent = minutes.toString().padStart(2, "0");
        document.getElementById("seconds").textContent = seconds.toString().padStart(2, "0");
      } else {
        document.getElementById("countdown").innerHTML = "<span>The big day is here!</span>";
      }
    }
    
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
